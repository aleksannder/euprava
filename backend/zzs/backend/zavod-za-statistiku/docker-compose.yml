version: "3.9"

services:
  db:
    image: postgres:16
    container_name: zzs-postgres
    environment:
      POSTGRES_DB: zzs
      POSTGRES_USER: zzs
      POSTGRES_PASSWORD: zzs
    ports:
      - "5432:5432"
    volumes:
      - zzsdb:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  zzsdb: {}