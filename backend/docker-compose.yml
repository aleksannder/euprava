version: "3.9"

services:
  zzs-db:
    image: postgres:16
    container_name: zzs-postgres
    environment:
      POSTGRES_DB: zzs
      POSTGRES_USER: zzs
      POSTGRES_PASSWORD: zzs
    ports:
      - "5432:5432"
    volumes:
      - zzsdb:/var/lib/postgresql/data
    restart: unless-stopped

  mup-db:
    image: postgres:16
    container_name: mup-postgres
    environment:
      POSTGRES_DB: mup
      POSTGRES_USER: mup
      POSTGRES_PASSWORD: mup
    ports:
      - "5433:5432"
    volumes:
      - mupdb:/var/lib/postgresql/data
    restart: unless-stopped
    
volumes:
  zzsdb: {}
  mupdb: {}