<div class="gdp-page">
  <h1>Ekonomija - BDP</h1>

  <mat-form-field appearance="outline" class="region-select">
    <mat-label>Region</mat-label>
    <mat-select [(ngModel)]="selectedRegion" (selectionChange)="loadData()">
      <mat-option [value]="'ALL'">Svi regioni</mat-option>
      <mat-option *ngFor="let r of regions" [value]="r">{{RegionUtil.getLabel(r)}}</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="highlight-container" *ngIf="highlight">
    <mat-card matTooltip="Rast: {{highlight.growthBillion | number:'1.1-2'}} milijardi EUR">
      <h2>{{highlight.growthPercent | number:'1.1-2'}} %</h2>
      <p>BDP rast - {{RegionUtil.getLabel(highlight.region)}}</p>
    </mat-card>
  </div>

  <div class="charts">
    <p-chart type="line" [data]="trendChartData" [options]="chartOptions"></p-chart>
    <p-chart type="bar" [data]="regionComparisonData" [options]="chartOptions"></p-chart>
  </div>

  <div class="table-container">
    <div class="table-header">
      <h3>Pregled podataka</h3>
      <button mat-icon-button color="primary" (click)="exportCsv()" matTooltip="Izvezi kao CSV">
        <mat-icon>download</mat-icon>
      </button>
    </div>

    <app-data-table
      [columns]="columns"
      [data]="tableData"
      [totalItems]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)">
    </app-data-table>
  </div>
</div>
