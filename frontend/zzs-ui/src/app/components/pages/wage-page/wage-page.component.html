<div class="wage-page">
  <h1>Zaposlenost i Plate</h1>

  <!-- HIGHLIGHT -->
  <div class="highlight-container" *ngIf="highlight">
    <mat-card matTooltip="Rast: {{highlight.growthRsd | number:'1.0-0'}} RSD">
      <h2>{{highlight.growthPercent | number:'1.1-2'}} %</h2>
      <p>Najveći rast plata - {{RegionUtil.getLabel(highlight.region)}}</p>
    </mat-card>
  </div>

  <!-- CHARTS -->
  <div class="charts">
    <mat-card>
      <h3>Trend prosečne plate</h3>
      <p-chart type="line" [data]="trendChartData" [options]="chartOptions"></p-chart>
    </mat-card>

    <mat-card>
      <h3>Poređenje po regionima</h3>
      <p-chart type="bar" [data]="comparisonChartData" [options]="chartOptions"></p-chart>
    </mat-card>
  </div>

  <!-- TABLE WITH EXPORT -->
  <div class="table-container">
    <div class="table-header">
      <h3>Pregled podataka</h3>
      <button mat-icon-button color="primary" (click)="exportCsv()" matTooltip="Izvezi kao CSV">
        <mat-icon>download</mat-icon>
      </button>
    </div>

    <app-data-table
      [columns]="[
        { key: 'year', label: 'Godina' },
        { key: 'region', label: 'Region' },
        { key: 'averageWage', label: 'Prosečna plata (RSD)' },
        { key: 'growthPercent', label: 'Rast (%)' }
      ]"
      [data]="tableData"
      [totalItems]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)">
    </app-data-table>
  </div>
</div>
