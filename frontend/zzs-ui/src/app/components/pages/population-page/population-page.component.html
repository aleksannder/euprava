<div class="population-page">
  <h1>Stanovništvo</h1>

  <mat-form-field appearance="outline" class="region-select">
    <mat-label>Region</mat-label>
    <mat-select [(ngModel)]="selectedRegion" (selectionChange)="loadData()">
      <mat-option *ngFor="let r of regions" [value]="r">{{RegionUtil.getLabel(r)}}</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="highlight-container" *ngIf="highlightExtremes">
    <mat-card matTooltip="Najmlađi region">
      <h2>{{RegionUtil.getLabel(highlightExtremes.youngestRegion)}}</h2>
      <p>{{highlightExtremes.youngestAge | number:'1.1-1'}} godina</p>
    </mat-card>

    <mat-card matTooltip="Najstariji region">
      <h2>{{RegionUtil.getLabel(highlightExtremes.oldestRegion)}}</h2>
      <p>{{highlightExtremes.oldestAge | number:'1.1-1'}} godina</p>
    </mat-card>
  </div>

  <div class="charts">
    <p-chart type="line" [data]="trendData" [options]="chartOptions"></p-chart>
    <p-chart type="line" [data]="projectionData" [options]="chartOptions"></p-chart>
    <p-chart type="bar" [data]="avgAgeData" [options]="chartOptions"></p-chart>
    <p-chart type="bar" [data]="naturalGrowthData" [options]="chartOptions"></p-chart>
    <p-chart type="pie" [data]="shareData" [options]="chartOptions"></p-chart>
  </div>
</div>
