<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        <div class="card">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block">
              <img [src]="imagePath" alt="login form" class="img-fluid" />
            </div>
            <div class="col-md-6 col-lg-7 d-flex align-items-center">
              <div class="card-body p-4 p-lg-5">
                <h1 class="text-center fw-bold mb-4">Login</h1>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="form-outline mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" formControlName="email" placeholder="Unesite vas email" />
                    <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger mt-1">
                      <small *ngIf="loginForm.get('email')?.errors?.['required']">Email je obavezan.</small>
                      <small *ngIf="loginForm.get('email')?.errors?.['email']">Unesite validan email.</small>
                    </div>
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="password">Šifra</label>
                    <input type="password" id="password" class="form-control form-control-lg" formControlName="lozinka" placeholder="Unesite vasu lozinku" />
                    <div *ngIf="loginForm.get('lozinka')?.touched && loginForm.get('lozinka')?.invalid" class="text-danger mt-1">
                      <small>Šifra je obavezna.</small>
                    </div>
                  </div>

                  <div class="pt-1 mb-4">
                    <button class="btn btn-dark btn-lg btn-block" type="submit" [disabled]="loginForm.invalid">Login</button>
                  </div>

                  <p class="mb-5 pb-lg-2">
                    Nemate nalog? <a (click)="goToRegister()" class="register-link">Registruj se</a>
                  </p>
                </form>


              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-custom-alert
  *ngIf="showModal"
  [message]="alertMessage"
  [type]="alertType"
  (closed)="handleModalClose()">
</app-custom-alert>
